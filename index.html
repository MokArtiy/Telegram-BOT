<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Поймай лемура!</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            background: transparent;
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
            z-index: 10;
        }
        
        #timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
            z-index: 10;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 100;
        }
        
        #victoryImage {
            max-width: 200px;
            margin-bottom: 20px;
        }
        
        .button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        
        .button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="score">Счет: 0</div>
        <div id="timer">Время: 60</div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: white; z-index: 200;">
            Загрузка... 🦊
        </div>

        <div id="gameOver">
            <img id="victoryImage" src="" alt="Победа!">
            <h2 id="resultTitle">🎉 Поздравляем! 🎉</h2>
            <p id="resultMessage">Вы поймали лемура!</p>
            <p id="finalScore">Ваш счет: 0</p>
            <button class="button" onclick="restartGame()">Играть снова</button>
            <button class="button" onclick="closeGame()">Вернуться в бота</button>
        </div>
    </div>

    <script>
        function resizeCanvas() {
            canvas.width = window.innerWidth || 320;
            canvas.height = window.innerHeight || 568;
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const gameOverScreen = document.getElementById('gameOver');
        const victoryImage = document.getElementById('victoryImage');
        const finalScoreElement = document.getElementById('finalScore');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Загрузка изображений через HTTPS
        const images = {
            lemur: new Image(),
            player: new Image(),
            obstacle: new Image(),
            victory: new Image(),
            defeat: new Image(), 
            background: new Image()
        };

        // ЗАМЕНИ ЭТИ URL НА СВОИ HTTPS КАРТИНКИ!
        images.lemur.src = 'assets/lemur-l.png';
        images.player.src = 'assets/player-l.png';
        images.obstacle.src = 'assets/obstacle-l.png';
        images.victory.src = 'assets/victory-l.png';
        images.defeat.src = 'assets/defeat-l.png';
        images.background.src = 'https://via.placeholder.com/400x300/87CEEB/FFFFFF?text=Фон';

        // Игровые переменные
        let score = 0;
        let gameActive = true;
        let lastTime = 0;
        let gameTime = 60;
        let lastTimerUpdate = 0;
        let cameraX = 0;
        let gameSpeed = 4;

        // Игровые объекты
        const player = {
            x: 100,
            y: canvas.height - 150,
            width: 80,
            height: 120,
            velocityY: 0,
            gravity: 0.4,
            jumpPower: -15,
            isJumping: false
        };

        const lemur = {
            worldX: canvas.width - 200, // Начинаем в правой части экрана
            y: canvas.height - 130,
            width: 100,
            height: 100,
            speed: 2, // Уменьшил скорость лемура
            state: 'visible' // visible, escaping, caught
        };

        const obstacles = [];
        let obstacleTimer = 0;
        let gameStartTime = 0;

        // Функции игры
        function jump() {
            if (!player.isJumping && gameActive) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }
        }

        function createObstacle() {
            obstacles.push({
                worldX: cameraX + canvas.width + Math.random() * 200,
                y: canvas.height - 100,
                width: 60,
                height: 60
            });
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function updatePlayer() {
            player.velocityY += player.gravity;
            player.y += player.velocityY;

            if (player.y >= canvas.height - 150) {
                player.y = canvas.height - 150;
                player.velocityY = 0;
                player.isJumping = false;
            }
        }

        function updateWorld() {
            // Двигаем мир (камеру) вперед
            cameraX += gameSpeed;
            
            // Небольшое увеличение скорости со временем
            gameSpeed = 3 + (score * 0.002); // было 5 + (score * 0.005)
        }

        function updateLemur() {
            const currentTime = Date.now();
            const elapsedTime = (currentTime - gameStartTime) / 1000;

            if (lemur.state === 'visible') {
                // Лемур "стоит" справа от игрока — его экранная позиция фиксирована
                const desiredScreenX = player.x + player.width + 75;
                lemur.worldX = cameraX + desiredScreenX;

                if (elapsedTime > 1.5) {
                    lemur.state = 'escaping';
                }
                return;
            }

            if (lemur.state !== 'escaping') return;

            const remainingTime = Math.max(0, gameTime - elapsedTime);
            let escapeSpeed = gameSpeed + 0.9; // ← ключевое изменение!

            if (remainingTime <= 10) {
                const slowFactor = remainingTime / 10;
                escapeSpeed = gameSpeed - 0.6 + (1.5 * slowFactor);
            }

            // Двигаем лемура в мировых координатах вперёд
            lemur.worldX += escapeSpeed;
        }

        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacleScreenX = obstacles[i].worldX - cameraX;
                
                if (checkCollision(player, {
                    x: obstacleScreenX,
                    y: obstacles[i].y,
                    width: obstacles[i].width,
                    height: obstacles[i].height
                })) {
                    gameOver(false);
                    return;
                }

                if (obstacles[i].worldX < cameraX - 100) {
                    obstacles.splice(i, 1);
                    score += 5;
                    scoreElement.textContent = `Счет: ${score}`;
                }
            }
        }

        function updateTimer(timestamp) {
            if (lastTimerUpdate === 0) lastTimerUpdate = timestamp;
            
            if (timestamp - lastTimerUpdate > 1000) {
                gameTime--;
                timerElement.textContent = `Время: ${gameTime}`;
                lastTimerUpdate = timestamp;
                
                if (gameTime <= 0) {
                    gameOver(false);
                }
            }
        }

        function gameOver(isVictory) {
            gameActive = false;
            
            if (isVictory) {
                resultTitle.textContent = "🎉 Поздравляем! 🎉";
                resultMessage.textContent = "Вы поймали лемура!";
                finalScoreElement.textContent = `Ваш счет: ${score + 100}`;
                
                setTimeout(() => {
                    if (window.Telegram?.WebApp?.sendData) {
                        Telegram.WebApp.sendData(JSON.stringify({ action: "lemur_caught" }));
                    }
                }, 2000);
            } else {
                resultTitle.textContent = "💥 Игра окончена!";
                resultMessage.textContent = "Попробуйте еще раз!";
                finalScoreElement.textContent = `Ваш счет: ${score}`;
            }
            
            victoryImage.src = isVictory ? images.victory.src : images.defeat.src;
            gameOverScreen.style.display = 'block';
        }

        function checkVictory() {
            if (lemur.state !== 'escaping') return;

            const lemurScreenX = lemur.worldX - cameraX;
            const playerRight = player.x + player.width; // 180

            // Лемур должен быть перед игроком (справа), но не слишком далеко
            if (lemurScreenX > 0 && lemurScreenX <= playerRight) {
                lemur.state = 'caught';
                gameOver(true);
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фон
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Земля
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Лемур
            const lemurScreenX = lemur.worldX - cameraX;
            if (lemurScreenX > -100 && lemurScreenX < canvas.width + 100) {
                if (images.lemur.complete) {
                    ctx.drawImage(images.lemur, lemurScreenX, lemur.y, lemur.width, lemur.height);
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(lemurScreenX, lemur.y, lemur.width, lemur.height);
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.fillText('ЛЕМУР', lemurScreenX + 10, lemur.y + 30);
                }

                // Анимация лемура в зависимости от состояния
                if (lemur.state === 'visible') {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.font = '14px Arial';
                    ctx.fillText('Смотри! Лемур!', lemurScreenX - 20, lemur.y - 20);
                } else if (lemur.state === 'escaping') {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.font = '14px Arial';
                    ctx.fillText('Убегает!', lemurScreenX - 10, lemur.y - 20);
                }
            }

            // Игрок
            if (images.player.complete) {
                ctx.drawImage(images.player, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#FF6B6B';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText('ИГРОК', player.x + 10, player.y + 30);
            }

            // Препятствия
            obstacles.forEach(obstacle => {
                const obstacleScreenX = obstacle.worldX - cameraX;
                if (obstacleScreenX > -100 && obstacleScreenX < canvas.width + 100) {
                    if (images.obstacle.complete) {
                        ctx.drawImage(images.obstacle, obstacleScreenX, obstacle.y, obstacle.width, obstacle.height);
                    } else {
                        ctx.fillStyle = '#654321';
                        ctx.fillRect(obstacleScreenX, obstacle.y, obstacle.width, obstacle.height);
                        ctx.fillStyle = 'white';
                        ctx.font = '10px Arial';
                        ctx.fillText('КАКТУС', obstacleScreenX + 5, obstacle.y + 20);
                    }
                }
            });
            
            // Сообщение о состоянии лемура
            if (lemur.state === 'visible') {
                ctx.fillStyle = 'blue';
                ctx.font = '16px Arial';
                ctx.fillText('Лемур появился! Приготовьтесь!', canvas.width/2 - 150, 100);
            }
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameActive) {
                updateTimer(timestamp);
                updatePlayer();
                updateWorld();
                updateLemur();
                updateObstacles();
                checkVictory();
                drawGame();

                obstacleTimer += deltaTime;
                if (obstacleTimer > 1500) {
                    if (Math.random() < 0.7) {
                        createObstacle();
                    }
                    obstacleTimer = 0;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Управление
        document.addEventListener('keydown', (e) => {
            if ((e.code === 'Space' || e.code === 'ArrowUp') && gameActive) {
                jump();
            }
        });

        canvas.addEventListener('touchstart', jump);
        canvas.addEventListener('click', jump);

        function restartGame() {
            score = 0;
            gameActive = true;
            gameTime = 60;
            cameraX = 0;
            gameSpeed = 4;
            
            player.x = 100;
            player.y = canvas.height - 150;
            player.velocityY = 0;
            player.isJumping = false;
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            lemur.worldX = cameraX + player.x + player.width + 75;
            lemur.y = canvas.height - 130;
            lemur.state = 'visible';
            
            obstacles.length = 0;
            obstacleTimer = 0;
            lastTime = 0;
            lastTimerUpdate = 0;
            gameStartTime = Date.now();
            
            scoreElement.textContent = `Счет: ${score}`;
            timerElement.textContent = `Время: ${gameTime}`;
            gameOverScreen.style.display = 'none';
        }

        function closeGame() {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.close();
            }
        }

        // Запуск игры
        let imagesLoaded = 0;
        const totalImages = Object.keys(images).length;

        Object.values(images).forEach(img => {
            img.onload = () => {
                imagesLoaded++;
                if (imagesLoaded === totalImages) {
                    document.getElementById('loading').style.display = 'none';
                    restartGame();
                    gameLoop(0);
                }
            };
            img.onerror = () => {
                imagesLoaded++;
                if (imagesLoaded === totalImages) {
                    document.getElementById('loading').style.display = 'none';
                    restartGame();
                    gameLoop(0);
                }
            };
        });

        setTimeout(() => {
            if (imagesLoaded < totalImages) {
                restartGame();
                gameLoop(0);
            }
        }, 3000);
    </script>
</body>
</html>
